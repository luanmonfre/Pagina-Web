<body>
   <P>GRAU É ARTE é uma expressão que reflete a intersecção entre a matemática e a criatividade, onde conceitos geométricos e numéricos se transformam em obras visuais e experiências sensoriais. Essa abordagem reconhece que a matemática, muitas vezes vista como uma disciplina rígida, pode ser uma fonte de inspiração e beleza. Artistas e designers utilizam formas, simetrias e proporções para criar composições que não apenas encantam os olhos, mas também provocam reflexões sobre a relação entre lógica e estética. Essa fusão entre o rigor matemático e a liberdade artística resulta em criações que desafiam nossa percepção e ampliam os horizontes do que consideramos arte.</P>
